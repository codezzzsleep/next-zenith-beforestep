    <rect x="225" y="317" width="687" height="42" rx="9" fill="#2b2021" stroke="#754342"/>
    <text x="568" y="344" fill="#f5d0c6" font-size="16" text-anchor="middle">未通过 / 信息不足 → 主动安全停车或前移补拍</text>
    <text x="1170" y="335" fill="#e09f3e" font-size="15" text-anchor="end">17 场景 · 0 碰撞</text>
    <text x="1170" y="356" fill="#aebccd" font-size="14" text-anchor="end">3 到达 · 14 停车</text>
    <path d="M28 374H1172" stroke="#2d3b4e"/>
    <text x="28" y="401" fill="#d5deea" font-size="15">Lux3D 提供世界知识</text>
    <text x="254" y="401" fill="#e09f3e" font-size="18">×</text>
    <text x="287" y="401" fill="#d5deea" font-size="15">BeforeStep 负责空间配准</text>
    <text x="569" y="401" fill="#e09f3e" font-size="18">×</text>
    <text x="602" y="401" fill="#d5deea" font-size="15">MuJoCo 完成物理预演</text>
    <text x="863" y="401" fill="#e09f3e" font-size="18">=</text>
    <text x="904" y="401" fill="#e09f3e" font-size="18" font-weight="700">机器人空间前额叶</text>
  </g>
