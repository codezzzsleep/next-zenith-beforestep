    <text x="1168" y="46" fill="#aebccd" font-size="15" text-anchor="end">山猫 M20 · 先预测，再探索</text>
    <path d="M28 68H1172" stroke="#2d3b4e"/>
    <g fill="none" stroke="#e09f3e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M242 186H257"/><path d="M474 186H489"/><path d="M706 186H721"/><path d="M938 186H953"/>
    </g>
    <g transform="translate(28 86)">
      <rect width="214" height="208" rx="12" fill="#172235" stroke="#35455d"/>
      <circle cx="31" cy="31" r="17" fill="#25354c"/>
      <text x="31" y="36" text-anchor="middle" fill="#f5f2ea" font-size="15" font-weight="700">01</text>
      <text x="58" y="38" fill="#f5f2ea" font-size="19" font-weight="700">二维观测</text>
      <path d="M18 61H196" stroke="#35455d"/>
      <text x="18" y="91" fill="#d5deea" font-size="15">可见轮廓与太阳黑影</text>
      <text x="18" y="119" fill="#d5deea" font-size="15">只测到眼前的一面</text>
      <rect x="18" y="151" width="178" height="35" rx="6" fill="#0d1522"/>
      <text x="107" y="174" text-anchor="middle" fill="#aebccd" font-size="15">输入 RGB 图像</text>
    </g>
    <g transform="translate(260 86)">
