      <text x="31" y="36" text-anchor="middle" fill="#0d1522" font-size="15" font-weight="700">02</text>
      <text x="58" y="38" fill="#f5f2ea" font-size="19" font-weight="700">局部想象</text>
      <path d="M18 61H196" stroke="#725432"/>
      <text x="18" y="91" fill="#f0d4a8" font-size="16" font-weight="700">Aholo Lux3D</text>
      <text x="18" y="119" fill="#e3d6c2" font-size="15">物理世界重建先验</text>
      <text x="18" y="147" fill="#e3d6c2" font-size="15">生成 5–6 份 3D 候选</text>
      <text x="18" y="181" fill="#e09f3e" font-size="15">想象可能的背面</text>
    </g>
    <g transform="translate(492 86)">
      <rect width="214" height="208" rx="12" fill="#172235" stroke="#35455d"/>
      <circle cx="31" cy="31" r="17" fill="#25354c"/>
      <text x="31" y="36" text-anchor="middle" fill="#f5f2ea" font-size="15" font-weight="700">03</text>
      <text x="58" y="38" fill="#f5f2ea" font-size="19" font-weight="700">观测核对</text>
      <path d="M18 61H196" stroke="#35455d"/>
      <text x="18" y="91" fill="#d5deea" font-size="15">尺度 · 轮廓 · 可见面</text>
