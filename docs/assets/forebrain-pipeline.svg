      <text x="18" y="119" fill="#d5deea" font-size="15">配准回通道，完整试走</text>
      <text x="18" y="155" fill="#aebccd" font-size="14">R1 最小三维间隙</text>
      <text x="18" y="183" fill="#e09f3e" font-size="20" font-weight="700">47.541 mm</text>
